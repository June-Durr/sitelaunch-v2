<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/sitelaunch-icon-transparent-background.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Route-independent meta only. Title/description/keywords/canonical/
         Open Graph/Twitter are all page-specific and rendered per-route by
         SEOHead (react-helmet-async) - every route (Home, InsightArticle)
         already provides its own. Helmet doesn't remove tags it didn't add
         itself, so leaving page-specific values here as static duplicates
         would silently coexist with the route's real ones instead of being
         replaced by them. Prerendering bakes each route's actual Helmet
         output into its own shipped HTML, so nothing here is needed as a
         pre-hydration fallback. -->
    <meta name="author" content="SiteLaunch Studios" />
    <meta name="robots" content="index, follow" />

    <!-- Google Fonts: preconnect speeds up the connection, display=swap prevents render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />

    <!-- Google Analytics: load after page is interactive to reduce LCP impact -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      // Defer the config call until after the page loads
      window.addEventListener("load", function () {
        // Skip tracking for automated/headless browsers (e.g. the build's prerender pass)
        if (navigator.webdriver) return;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-NH1CR7MCH2";
        document.head.appendChild(s);
        gtag("config", "G-NH1CR7MCH2", { transport_type: "beacon" });
      });
    </script>
    <!-- Microsoft Clarity: load after page is interactive to reduce LCP impact -->
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        // Skip for automated/headless browsers (e.g. the build's prerender
        // pass). Without this guard, the prerender snapshot captures the
        // <script src="clarity.ms"> tag this IIFE inserts at runtime baked
        // into the static HTML - so every real visitor's browser would load
        // Clarity once from that baked-in tag, then a second time when this
        // same bootstrap script runs again and re-inserts it, triggering
        // Clarity's "multiple tags detected" (CL001) warning.
        if (navigator.webdriver) return;
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "xydrja7gjw");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
